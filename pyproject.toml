[project]
name = "aviscape"
version = "0.0.0"
description = "Real-time, model-free bird soundscape monitoring (workspace root)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = [
    "aviscape-api",
    "aviscape-contracts",
    "aviscape-dsp",
    "aviscape-edge",
    "aviscape-stream",
    "aviscape-synth",
]

[project.urls]
Repository = "https://github.com/soheil-mp/aviscape"
Roadmap = "https://github.com/soheil-mp/aviscape/blob/main/ROADMAP.md"

[tool.uv]
# The root only ties the workspace together; it is never built or published.
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
aviscape-api = { workspace = true }
aviscape-contracts = { workspace = true }
aviscape-dsp = { workspace = true }
aviscape-edge = { workspace = true }
aviscape-stream = { workspace = true }
aviscape-synth = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "scipy-stubs>=1.18.1.1",
]

# --- Ruff: linting and formatting -------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/*/src", "packages/*/tests", "tools"]

[tool.ruff.lint]
select = [
    "A",    # builtins shadowing
    "B",    # bugbear
    "C4",   # comprehensions
    "D",    # docstrings
    "DTZ",  # timezone-aware datetimes (event time matters here)
    "E",    # pycodestyle errors
    "ERA",  # commented-out code
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "NPY",  # NumPy-specific rules
    "PERF", # performance anti-patterns
    "PL",   # pylint
    "PT",   # pytest style
    "RUF",  # ruff-specific rules
    "S",    # security (bandit)
    "SIM",  # simplifications
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101", "PLR2004"]
"conftest.py" = ["D"]

[tool.ruff.format]
docstring-code-format = true

# --- mypy: strict static typing ---------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/packages/aviscape-dsp/src:$MYPY_CONFIG_FILE_DIR/packages/aviscape-synth/src:$MYPY_CONFIG_FILE_DIR/packages/aviscape-contracts/src:$MYPY_CONFIG_FILE_DIR/packages/aviscape-edge/src:$MYPY_CONFIG_FILE_DIR/packages/aviscape-stream/src:$MYPY_CONFIG_FILE_DIR/packages/aviscape-api/src"
files = ["packages", "tools"]
explicit_package_bases = true

# --- pytest, coverage, Hypothesis -------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages", "tools"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = ["slow: long-running tests, excluded from the quick loop with -m 'not slow'"]

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = [
    "aviscape_api",
    "aviscape_contracts",
    "aviscape_dsp",
    "aviscape_edge",
    "aviscape_stream",
    "aviscape_synth",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

# --- Dependency licence policy (checked by tools/check_licences.py) ----------
[tool.aviscape.licences]
# Licences compatible with shipping this project under MIT. "BSD" covers
# packages that only declare the generic BSD trove classifier.
allowed = [
    "0BSD",
    "Apache-2.0",
    "BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "PSF-2.0",
    "Unlicense",
    "Zlib",
]

[tool.aviscape.licences.exceptions]
# "distribution-name" = "why it was reviewed and accepted"
