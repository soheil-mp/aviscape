[project]
name = "aviscape-dsp"
version = "0.0.0"
description = "Deterministic soundscape signal processing: spectrograms, acoustic indices, signal QA."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Soheil Mohammadpour" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"
