[project]
name = "aviscape-edge"
version = "0.0.0"
description = "Edge agent: stream adapters, windowing, feature extraction and delivery."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Soheil Mohammadpour" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aviscape-dsp",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
aviscape-dsp = { workspace = true }
